<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acompanhe seu técnico</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#11243b;font:15px system-ui,-apple-system,sans-serif}.head{padding:24px;background:linear-gradient(125deg,#081725,#0b78c2);color:#fff}.head small{font-weight:800;letter-spacing:.13em;color:#89d8ff}.head h1{margin:7px 0 4px;font-size:28px}.head p{margin:0;color:#d7efff}.status{margin:16px;padding:17px;border-radius:14px;background:#fff;box-shadow:0 8px 28px #16324d15}.status b,.status span{display:block}.status b{font-size:18px}.status span{margin-top:5px;color:#60748a}#map{height:calc(100dvh - 245px);min-height:380px;margin:0 16px 16px;border-radius:16px;overflow:hidden}.privacy{padding:0 20px 18px;color:#697a8d;font-size:12px}.tech{background:#0879c9;border:3px solid white;border-radius:50%;width:24px;height:24px;box-shadow:0 2px 9px #0005}.home{background:#f15328;border:3px solid white;border-radius:4px;width:22px;height:22px;box-shadow:0 2px 9px #0005}</style></head><body><header class="head"><small>ACOMPANHAMENTO DA INSTALAÇÃO</small><h1 id="title">Seu técnico está a caminho</h1><p id="subtitle">Atualizando a localização com segurança.</p></header><section class="status"><b id="status">Carregando acompanhamento…</b><span id="updated"></span></section><div id="map"></div><p class="privacy">Este link é temporário e mostra somente o técnico responsável por esta instalação. A posição pode variar conforme a precisão do aparelho.</p><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const token=location.pathname.split('/').filter(Boolean).pop();let map,techMarker,homeMarker,first=true;
function age(value){const seconds=Math.max(0,Math.round(Date.now()/1000-Number(value)));return seconds<60?'agora':`há ${Math.floor(seconds/60)} min`;}
async function refresh(){try{const response=await fetch(`/api/public/tracking/${encodeURIComponent(token)}`,{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.detail||'Acompanhamento indisponível.');document.querySelector('#title').textContent=`Olá, ${data.client}. ${data.technician} está a caminho`;const d=data.destination;if(!map){map=L.map('map',{zoomControl:true}).setView([d.latitude,d.longitude],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);homeMarker=L.marker([d.latitude,d.longitude],{icon:L.divIcon({className:'',html:'<div class="home"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map).bindTooltip('Local da instalação');}if(data.location){const p=[data.location.latitude,data.location.longitude];if(!techMarker)techMarker=L.marker(p,{icon:L.divIcon({className:'',html:'<div class="tech"></div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map).bindTooltip(`Técnico ${data.technician}`);else techMarker.setLatLng(p);document.querySelector('#status').textContent=`${data.technician} está em deslocamento`;document.querySelector('#updated').textContent=`Localização atualizada ${age(data.location.updated_at)} · precisão aproximada de ${Math.round(data.location.accuracy||0)} m`;if(first){map.fitBounds(L.latLngBounds([p,[d.latitude,d.longitude]]).pad(.25),{maxZoom:16});first=false;}}else{document.querySelector('#status').textContent='Aguardando localização do técnico';document.querySelector('#updated').textContent='A tela atualizará automaticamente quando o deslocamento for compartilhado.';}}catch(error){document.querySelector('#status').textContent=error.message;document.querySelector('#updated').textContent='Solicite um novo link ao atendimento se necessário.';}}
refresh();setInterval(refresh,15000);
</script></body></html>
